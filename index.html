<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emberfall — Lumina HD-2D Engine</title>
  <meta name="description" content="Emberfall — Riverside Village: an HD-2D diorama built with the Lumina engine on three.js." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' rx='3' fill='%23140f17'/%3E%3Cpath fill='%23c9a45c' d='M7 2h2v1h1v2h1v2h1v4h-1v1h-1v1H6v-1H5v-1H4V7h1V5h1V3h1z'/%3E%3Cpath fill='%23f59a2e' d='M7 5h2v2h1v3H9v1H7v-1H6V7h1z'/%3E%3Cpath fill='%23fff6d0' d='M7 8h2v2H7z'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    #app canvas { display: block; width: 100%; height: 100%; }

    /* Loading indicator: a small ember, a thin gold rule and a caption. */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 55%, #17121c 0%, #050407 70%);
      color: #d9c18a;
      font: 400 13px/1.4 Georgia, 'Times New Roman', serif;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      transition: opacity 0.85s ease;
    }
    #loading.is-done { opacity: 0; pointer-events: none; }
    #loading .inner { display: grid; justify-items: center; gap: 18px; }
    #loading .ember {
      width: 10px;
      height: 10px;
      transform: rotate(45deg);
      background: #f59a2e;
      box-shadow: 0 0 12px 3px rgba(245, 154, 46, 0.55), 0 0 36px 10px rgba(245, 120, 46, 0.18);
      animation: ember 1.8s ease-in-out infinite;
    }
    #loading .title { font-size: 20px; letter-spacing: 0.5em; color: #ead9a6; margin-right: -0.5em; }
    #loading .bar {
      width: min(280px, 60vw);
      height: 1px;
      background: rgba(201, 164, 92, 0.22);
      overflow: hidden;
    }
    #loading .bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #8a6a2c, #f2d072);
      transform-origin: 0 50%;
      transform: scaleX(0.02);
      transition: transform 0.35s ease;
    }
    #loading .label { font-size: 11px; color: rgba(217, 193, 138, 0.6); letter-spacing: 0.24em; }
    #loading.is-error .label {
      color: #e0674f;
      max-width: min(640px, 86vw);
      text-align: center;
      text-transform: none;
      letter-spacing: 0.08em;
      line-height: 1.7;
    }
    #loading.is-error .ember { animation: none; background: #7a3a2e; box-shadow: none; }
    #loading .actions { display: none; gap: 28px; margin-top: 10px; }
    #loading.is-error .actions { display: flex; }
    #loading .actions a {
      color: #d9c18a;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-decoration: none;
      padding: 6px 2px;
      border-bottom: 1px solid rgba(201, 164, 92, 0.3);
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    #loading .actions a:hover, #loading .actions a:focus-visible { color: #f2d072; border-color: #f2d072; outline: none; }
    @keyframes ember {
      0%, 100% { opacity: 0.75; transform: rotate(45deg) scale(0.9); }
      50% { opacity: 1; transform: rotate(45deg) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) { #loading .ember { animation: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading" role="status" aria-live="polite">
    <div class="inner">
      <div class="ember"></div>
      <div class="title">Emberfall</div>
      <div class="bar"><i></i></div>
      <div class="label">Loading</div>
      <div class="actions"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
